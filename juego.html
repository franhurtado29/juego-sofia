<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Letras Mágicas</title>
<style>
body { font-family: 'Comic Sans MS', cursive; background: linear-gradient(#ffe4f0, #e0f7ff); text-align: center; margin:0; }
h1 { color:#ff69b4; }
button { padding:12px; margin:8px; border:none; border-radius:15px; background:#ffb6c1; font-size:16px; }
button:hover { background:#ff69b4; color:white; }
.game { display:none; padding:15px; }
.active { display:block; }
.card { background:white; border-radius:20px; padding:20px; margin:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
#score { font-size:20px; color:#333; }
.big { font-size:28px; }
input { padding:10px; border-radius:10px; border:1px solid #ccc; }
</style>
</head>
<body>
<h1>🎮 Letras Mágicas</h1>
<p id="score">⭐ Puntos: 0</p>
<p id="timer">⏱️ Tiempo: 60</p>
<button onclick="startExam()">📝 Modo examen</button>

<br>
<button onclick="showGame('g1')">🔍 Caza letra</button>
<button onclick="showGame('g2')">🕵️ Intruso</button>
<button onclick="showGame('g3')">✏️ Completa</button>
<button onclick="showGame('g4')">⚡ Rápido</button>
<button onclick="showGame('g5')">🎯 Elige bien</button>

<div id="g1" class="game card">
<p>👉 ¿La palabra tiene X, K, W, Y o CH?</p>
<p id="word" class="big"></p>
<button onclick="check1(true)">✅ Sí</button>
<button onclick="check1(false)">❌ No</button>
</div>

<div id="g2" class="game card">
<p>👉 Escribe la palabra que NO tiene letra mágica</p>
<p id="words" class="big"></p>
<input id="a2"><button onclick="check2()">OK</button>
</div>

<div id="g3" class="game card">
<p>👉 Completa la palabra</p>
<p id="inc" class="big"></p>
<input id="a3"><button onclick="check3()">OK</button>
</div>

<div id="g4" class="game card">
<p>👉 Escribe una palabra con la letra</p>
<p id="fastWord" class="big"></p>
<input id="fastAns"><button onclick="checkFast()">OK</button>
</div>

<div id="g5" class="game card">
<p>👉 ¿Tiene letra mágica?</p>
<p id="chooseWord" class="big"></p>
<button onclick="choose(true)">Tiene</button>
<button onclick="choose(false)">No tiene</button>
</div>

<script>
let score=0,total=0,time=60,timerInterval;

function updateScore(){scoreEl.innerText='⭐ Puntos: '+score;}
function addPoint(){score++; total++; updateScore(); checkEnd();}
function fail(){ total++; checkEnd(); }

function showGame(id){document.querySelectorAll('.game').forEach(g=>g.classList.remove('active')); document.getElementById(id).classList.add('active');}

function startExam(){time=60; timerEl.innerText='⏱️ Tiempo: '+time; clearInterval(timerInterval); timerInterval=setInterval(()=>{time--; timerEl.innerText='⏱️ Tiempo: '+time; if(time<=0){clearInterval(timerInterval); checkEnd();}},1000);}

function checkEnd(){if(total>=20||time<=0){let m=''; if(score>=16)m='🏆 ¡Sobresaliente!'; else if(score>=10)m='🎓 ¡Has aprobado!'; else m='💪 Sigue practicando'; alert(m); score=0; total=0; updateScore();}}

// Juegos con 20 elementos
const w1=[{w:'chocolate',h:true},{w:'mesa',h:false},{w:'kiwi',h:true},{w:'casa',h:false},{w:'yate',h:true},{w:'perro',h:false},{w:'xilofono',h:true},{w:'silla',h:false},{w:'whisky',h:true},{w:'leche',h:true},{w:'sol',h:false},{w:'kilo',h:true},{w:'mano',h:false},{w:'yogur',h:true},{w:'coche',h:true},{w:'luna',h:false},{w:'wifi',h:true},{w:'pan',h:false},{w:'churro',h:true},{w:'gato',h:false}];
let i1=0; function check1(a){if(a===w1[i1].h)addPoint(); else fail(); i1=(i1+1)%w1.length; word.innerText=w1[i1].w;}

const w2=[
{l:['chico','leche','casa'],i:'casa'},{l:['kilo','kiwi','pera'],i:'pera'},{l:['yate','yogur','mesa'],i:'mesa'},{l:['wifi','whisky','pan'],i:'pan'},{l:['churro','chicle','sol'],i:'sol'},{l:['xilofono','xenon','perro'],i:'perro'},{l:['ketchup','kilo','gato'],i:'gato'},{l:['yema','yate','luna'],i:'luna'},{l:['chico','churro','mesa'],i:'mesa'},{l:['wifi','web','casa'],i:'casa'},{l:['xilofono','taxi','pan'],i:'pan'},{l:['kilo','koala','sol'],i:'sol'},{l:['yate','yoga','perro'],i:'perro'},{l:['chicle','chico','luna'],i:'luna'},{l:['wifi','whisky','mesa'],i:'mesa'},{l:['xenon','xilofono','gato'],i:'gato'},{l:['kilo','ketchup','pan'],i:'pan'},{l:['yogur','yate','sol'],i:'sol'},{l:['churro','chico','perro'],i:'perro'},{l:['wifi','web','luna'],i:'luna'}];
let i2=0; function load2(){words.innerText=w2[i2].l.join(', ');} function check2(){if(a2.value.toLowerCase()==w2[i2].i)addPoint(); else fail(); i2=(i2+1)%w2.length; load2(); a2.value='';}

const w3=[{t:'_ocolate',a:'ch'},{t:'_ilo',a:'k'},{t:'_ate',a:'y'},{t:'_urro',a:'ch'},{t:'_ifi',a:'w'},{t:'_enon',a:'x'},{t:'_ogur',a:'y'},{t:'_ilo',a:'k'},{t:'_eche',a:'l'},{t:'_asa',a:'c'},{t:'_ato',a:'g'},{t:'_an',a:'p'},{t:'_una',a:'l'},{t:'_esa',a:'m'},{t:'_illa',a:'s'},{t:'_ilofono',a:'x'},{t:'_hicle',a:'c'},{t:'_arate',a:'k'},{t:'_ate',a:'y'},{t:'_oche',a:'c'}];
let i3=0; function load3(){inc.innerText=w3[i3].t;} function check3(){if(a3.value.toLowerCase()==w3[i3].a)addPoint(); else fail(); i3=(i3+1)%w3.length; load3(); a3.value='';}

const w4=['ch','k','y','x','w']; let i4=0; function load4(){fastWord.innerText='Letra: '+w4[i4];} function checkFast(){if(fastAns.value.toLowerCase().includes(w4[i4]))addPoint(); else fail(); i4=(i4+1)%w4.length; load4(); fastAns.value='';}

const w5=[{w:'wifi',h:true},{w:'casa',h:false},{w:'chocolate',h:true},{w:'mesa',h:false},{w:'kiwi',h:true},{w:'perro',h:false},{w:'yate',h:true},{w:'luna',h:false},{w:'whisky',h:true},{w:'sol',h:false},{w:'kilo',h:true},{w:'pan',h:false},{w:'churro',h:true},{w:'gato',h:false},{w:'xilofono',h:true},{w:'silla',h:false},{w:'yogur',h:true},{w:'coche',h:true},{w:'libro',h:false},{w:'web',h:true}];
let i5=0; function choose(a){if(a===w5[i5].h)addPoint(); else fail(); i5=(i5+1)%w5.length; chooseWord.innerText=w5[i5].w;}

// init
const scoreEl=document.getElementById('score');
const timerEl=document.getElementById('timer');
const word=document.getElementById('word');
const words=document.getElementById('words');
const inc=document.getElementById('inc');
const chooseWord=document.getElementById('chooseWord');

word.innerText=w1[0].w; load2(); load3(); load4(); chooseWord.innerText=w5[0].w;
</script>
</body>
</html>
